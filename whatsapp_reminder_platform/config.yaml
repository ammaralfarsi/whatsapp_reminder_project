name: "WhatsApp Reminder Platform"
version: "1.8.0"
slug: "whatsapp_reminder_platform"
description: "Multi-user WhatsApp reminders via WAHA, with optional Postgres/Sheets storage."
url: "https://github.com/ammaralfarsi/whatsapp_reminder_project"
# Prebuilt multi-arch image, published by .github/workflows/build-app-image.yml
# on every push to main. Supervisor pulls this instead of building on-device -
# critical on a Raspberry Pi, where compiling TypeScript locally can exhaust
# RAM and hang the whole box (as happened during the first install attempt).
image: "ghcr.io/ammaralfarsi/whatsapp-reminder-platform"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8086
# Adds an "Open Web UI" button on the add-on's Info tab that opens the app
# in its own new browser tab/window (direct port, not the embedded Ingress
# panel) - separate from the sidebar panel, which stays embedded either way.
webui: "http://[HOST]:[PORT:8086]/"
panel_icon: mdi:whatsapp
timeout: 300
ports:
  8086/tcp: 8086
ports_description:
  8086/tcp: "Reminder platform HTTP API"
# Left off on purpose: Home Assistant's `docker_api` option only ever grants
# *read-only* access to a Supervisor-proxied Docker API (that's HA's own
# design, not a config choice this add-on could work around), so it cannot
# be used to let "Auto" Postgres mode create a container from inside this
# add-on - turning it on would only mark the add-on "not protected" for no
# benefit. Auto mode only works in the plain Docker/docker-compose
# deployment, where a real, writable docker.sock can be bind-mounted in. For
# this add-on, use "Manual" mode below with a Postgres you already have
# (your own server, a managed one, or the official "PostgreSQL" add-on).
docker_api: false
options:
  # IANA name (e.g. "Europe/Berlin"), matching Home Assistant's own Settings ->
  # System -> General -> Time zone. This container defaults to UTC like any
  # other Docker container - it does NOT automatically inherit HA's timezone.
  # Only matters for reminders created without an explicit UTC time (the HA
  # dashboard card's input_datetime, or the old Flutter app's date format);
  # `/reminder.html` always sends an unambiguous UTC instant regardless of
  # this setting. Defaults to UTC; change it to match Home Assistant.
  timezone: "UTC"
  # Comma-separated admin key(s) - paste one of these into the Settings page
  # (/settings.html, top of the page) to unlock storage backend selection,
  # Postgres setup and "Connect with Google". Leave blank and one is
  # generated for you on first boot (check this add-on's Log tab for the
  # one-time notice with the value) - or set your own here instead.
  admin_api_keys: ""
  storage_backends: "ha_local"
  # Used to build the Google OAuth redirect URI (must exactly match an
  # "Authorized redirect URI" in your Google Cloud OAuth client). Defaults to
  # localhost, which only works if you open this add-on's UI from the same
  # machine - set this to your real HA URL (e.g. https://ha.example.com:8086)
  # to use "Connect with Google" from elsewhere.
  public_base_url: "http://localhost:8086"

  # --- Postgres: fill these in, or leave "auto" to have one created for you ---
  postgres_mode: "manual"
  postgres_host: ""
  postgres_port: 5432
  postgres_database: "reminders"
  postgres_user: "reminder_user"
  postgres_password: ""
  postgres_ssl: false
  # Advanced: a full connection string, only if you need something these
  # fields can't express (e.g. a managed provider's extra query params).
  # Overrides every postgres_* field above when set.
  database_url: ""

  # Powers the "Connect with Google" button in Settings - see .env.example
  # for how to create this OAuth client. This is the only way to connect
  # Google Sheets; which spreadsheet to use is picked from Settings after
  # connecting, not set here.
  google_oauth_client_id: ""
  google_oauth_client_secret: ""

  waha_base_url: ""
  waha_api_key: ""
  # Plain http, not https - the internal Supervisor proxy (172.30.32.2 on the
  # add-on's private docker network) only listens on port 80 there. https
  # here fails with ECONNREFUSED on :443 (this was wrong before 1.7.1).
  ha_notify_webhook_url: "http://supervisor/core/api/webhook/reminder_sent"
  scheduler_cron: "*/1 * * * *"
  default_footer_template: "\n\n~Auto Reminder~      ~تذكير تلقائي~"
schema:
  timezone: "str?"
  admin_api_keys: "str?"
  # Bootstrap-only default for first boot; change which backend(s) are
  # active any time afterwards from the add-on's web UI (Settings, reached
  # via Ingress or http://<host>:8086/settings.html) without restarting.
  storage_backends: "list(ha_local|postgres|sheets|postgres+sheets|postgres+ha_local|sheets+ha_local|postgres+sheets+ha_local)"
  public_base_url: "str?"

  # "auto": NOT supported by this add-on - Home Assistant's docker_api is
  # read-only, so container creation always gets refused here regardless of
  # this setting. It only works in the plain Docker/docker-compose
  # deployment. Selecting it here will just log guidance and fall back to
  # Manual.
  # "manual": connect to a Postgres you already have, using the fields below
  # (your own server, a managed one, or the official "PostgreSQL" add-on).
  postgres_mode: "list(auto|manual)"
  postgres_host: "str?"
  postgres_port: "int(1,65535)?"
  postgres_database: "str?"
  postgres_user: "str?"
  postgres_password: "password?"
  postgres_ssl: "bool?"
  database_url: "str?"

  google_oauth_client_id: "str?"
  google_oauth_client_secret: "password?"
  waha_base_url: "url"
  waha_api_key: "password"
  ha_notify_webhook_url: "str?"
  scheduler_cron: "str"
  default_footer_template: "str"
map:
  - addon_config:rw
  - ssl
