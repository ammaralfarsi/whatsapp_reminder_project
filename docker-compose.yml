version: "3.8"

services:
  reminder-app:
    build: .
    container_name: whatsapp-reminder-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./secrets:/app/secrets:ro
      # Persists settings.json (storage backend selection, Google OAuth
      # tokens, Postgres config) and the "Home Assistant local" JSON store
      # across container recreates.
      - ./data:/app/data
      # Optional: uncomment to let Settings -> Postgres -> Auto create a
      # sibling postgres:16-alpine container for you via the Docker socket.
      # Without this, Auto mode falls back to handing you a docker-compose
      # block to paste in yourself.
      # - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: whatsapp-reminder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: reminder_user
      POSTGRES_PASSWORD: reminder_pass
      POSTGRES_DB: reminders
    ports:
      - "5432:5432"
    volumes:
      - reminder_pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  reminder_pg_data:
